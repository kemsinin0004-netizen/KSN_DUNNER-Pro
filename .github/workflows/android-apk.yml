name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm test
          pnpm test:coverage
          pnpm check
          pnpm lint

      - name: Add coverage summary to workflow
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const row = (name, value) => `${name} | ${value.pct}% | ${value.covered}/${value.total}`;
            console.log('## Automated API Test Coverage');
            console.log('');
            console.log('| Metric | Coverage | Covered / Total |');
            console.log('|---|---:|---:|');
            console.log(`| ${row('Statements', summary.statements)} |`);
            console.log(`| ${row('Branches', summary.branches)} |`);
            console.log(`| ${row('Functions', summary.functions)} |`);
            console.log(`| ${row('Lines', summary.lines)} |`);
            NODE
          else
            echo 'Coverage summary was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillnext-coverage-${{ github.run_number }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/coverage-final.json') != ''
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage/clover.xml
          flags: otp-api
          name: skillnext-otp-${{ github.run_number }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with commit information
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/skillnext-${GITHUB_SHA::7}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillnext-android-apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and attach APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SkillNext Android v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.apk

      - name: Notify Telegram about successful APK release
        if: success() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ github.run_number }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          ✅ SkillNext APK និង GitHub Release បានបង្កើតជោគជ័យ

          Repository: $GITHUB_REPOSITORY
          Tag: v$GITHUB_RUN_NUMBER

          ទាញយក APK: $RELEASE_URL
          EOF
          )

          curl --fail --silent --show-error --retry 3 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Print installation instructions
        run: |
          echo "APK artifact created successfully."
          echo "Download it from the workflow run's Artifacts section."
          echo "Install locally with: adb install artifacts/skillnext-${GITHUB_SHA::7}-debug.apk"
